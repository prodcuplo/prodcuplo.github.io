name: Tests et déploiement

on:
  push:
    branches: [main]
  # Tant que GitHub Pages est réglé sur « Deploy from a branch », GitHub publie
  # aussi le contenu brut du dépôt après chaque push. Ce déclencheur relance
  # alors notre déploiement juste après, pour que le vrai site ait le dernier mot.
  # Il devient inactif dès que la source est réglée sur « GitHub Actions ».
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Si un test de formule échoue, rien n'est publié.
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
