name: Données par ville

# Retélécharge les données officielles (Crous, loyers, repères communaux) sur un
# serveur GitHub, qui a accès aux sites publics, et dépose data/villes.json sur
# la branche « donnees/villes » (écrasée à chaque exécution, ne jamais y travailler).
# Ne publie rien sur le site : la relecture du diff et le commit sur main restent
# à faire (voir AUTOMATION.md, étape 3).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/update-data.js
      - .github/workflows/donnees.yml

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run data
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: git diff --stat
      - name: Déposer villes.json sur la branche donnees/villes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B donnees/villes
          git add data/villes.json
          git commit -m "Données par ville du $(date -u +%F) (exécution ${{ github.run_id }})" || echo "Aucun changement"
          git push --force origin donnees/villes
