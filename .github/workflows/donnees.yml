name: Données par ville

# Retélécharge les données officielles (Crous, loyers, repères communaux) sur un
# serveur GitHub, qui a accès aux sites publics, et fournit data/villes.json en
# artefact. Ne publie rien : la relecture du diff et le commit restent manuels
# (voir AUTOMATION.md, étape 3).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/update-data.js
      - .github/workflows/donnees.yml

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run data
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: villes
          path: data/villes.json
          retention-days: 14
